server {
    listen 80;
    listen [::]:80;
    server_name weronikarafal.com www.weronikarafal.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name weronikarafal.com www.weronikarafal.com;
    ssl_certificate /etc/nginx/ssl/weronikarafal_origin.pem;
    ssl_certificate_key /etc/nginx/ssl/weronikarafal_origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    include /etc/nginx/snippets/weronikarafal-realip.conf;
    client_max_body_size 16k;
    error_log /var/log/nginx/weronika_error.log warn;
    # Do not record guest URLs, IPs or form data in site access logs.
    access_log off;

    location = /healthz { return 404; }
    location = /revision.txt {
        root /var/lib/weronikarafal/current/public;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /assets/ {
        root /var/lib/weronikarafal/current/public;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://127.0.0.1:18083;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache off;
        proxy_read_timeout 35s;
    }
}
