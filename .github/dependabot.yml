version: 2
updates:
  # Application dependencies are pinned in requirements.txt.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
      include: scope
    groups:
      python-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  # Keep the existing full-SHA pins for Actions; Dependabot updates those pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
