name: Bug report
description: Report a reproducible problem using synthetic data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, read https://github.com/Rafalbanas/weronikarafal/security/policy instead.
        Never post invitation codes, guest details, private photos or secrets here.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal example using synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device and commit
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks already tried
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I used synthetic data and removed secrets and private media.
          required: true
