name: Feature request
description: Suggest a thoughtful improvement for guests or organisers.
title: "[Idea]: "
body:
  - type: markdown
    attributes:
      value: Please use fictional examples. Never include guest data, invitation codes or private media.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe who is affected and their current experience.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Include accessibility, mobile and no-JavaScript considerations where relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues and used only synthetic examples.
          required: true
